<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 400" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#002d5e"/>
      <stop offset="100%" stop-color="#003b7a"/>
    </linearGradient>
  </defs>
  <rect width="600" height="400" fill="url(#bgGrad1)" rx="12"/>
  <rect x="15" y="15" width="570" height="370" fill="none" stroke="#c8102e" stroke-width="4" stroke-dasharray="10 6" rx="8"/>
  
  <!-- Icon: Camera & Hand / Drum Symbol -->
  <g transform="translate(300, 150)" text-anchor="middle">
    <!-- Drum / Signal representation -->
    <circle cx="0" cy="-20" r="50" fill="#c8102e" opacity="0.9"/>
    <path d="M-30,-20 L0,-55 L30,-20 L15,15 L-15,15 Z" fill="#ffffff" opacity="0.9"/>
    <circle cx="0" cy="-20" r="16" fill="#003b7a"/>
  </g>

  <!-- Text -->
  <text x="300" y="240" font-family="Arial, sans-serif" font-size="24" font-weight="bold" fill="#ffffff" text-anchor="middle">
    Sinal do Toque - Foto 1
  </text>
  <text x="300" y="275" font-family="Arial, sans-serif" font-size="16" fill="#e0e0e0" text-anchor="middle">
    (Exemplo: Posição de Chamada / Preparação)
  </text>
  <text x="300" y="320" font-family="Arial, sans-serif" font-size="14" fill="#ffcc00" text-anchor="middle">
